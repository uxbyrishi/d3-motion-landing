<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScalpX Mobile Onboarding Showcase (1024x768)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F7F5;--tray:#EEEEEA;--acc:#2F5BFF;
}
html,body{
  width:1024px;height:768px;overflow:hidden;background:var(--bg);
  font-family:Inter,system-ui,sans-serif;
  color:#141416;-webkit-font-smoothing:antialiased;
}
#root{
  position:relative;width:1024px;height:768px;overflow:hidden;background:var(--bg);
  display:flex;align-items:center;justify-content:center;gap:36px;padding:32px;
}
.studio-card{
  width:240px;background:#fff;border-radius:20px;padding:22px;
  box-shadow:0 1px 2px rgba(20,20,30,.05),0 12px 28px rgba(20,20,30,.06);
}
.studio-card .title{font-size:13px;font-weight:700;color:#141416;margin-bottom:4px}
.studio-card .sub{font-size:11px;color:#8B8B87;margin-bottom:16px}
.studio-card .metric{background:#F7F7F5;border-radius:12px;padding:12px;margin-bottom:10px}
.studio-card .metric-val{font-size:16px;font-weight:800;color:#2F5BFF}
.studio-card .metric-lbl{font-size:10px;color:#6B7280;font-weight:600;margin-top:2px}

.phone-scaler{
  width:393px;height:852px;transform:scale(0.82);transform-origin:center center;
  border-radius:46px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.35);flex:none;
}
.phone-scaler iframe{
  width:100%;height:100%;border:none;display:block;
}
</style>
</head>
<body>
<div id="root">
  <div class="studio-card">
    <div class="title">Batch Pipeline</div>
    <div class="sub">Multi-Screen Trading App</div>
    <div class="metric">
      <div class="metric-val">393 &times; 852</div>
      <div class="metric-lbl">Retina Mobile Canvas</div>
    </div>
    <div class="metric">
      <div class="metric-val">3 Variants</div>
      <div class="metric-lbl">Batch Programmatic Video</div>
    </div>
    <div class="metric">
      <div class="metric-val">0 Cloud Fees</div>
      <div class="metric-lbl">Offline GPU Encoder</div>
    </div>
  </div>

  <div class="phone-scaler">
    <iframe src="/assets/ScalpX_Onboarding_fixed.html" title="ScalpX Onboarding Flow"></iframe>
  </div>

  <div class="studio-card">
    <div class="title">Export Profile</div>
    <div class="sub">Asset Generation</div>
    <div class="metric">
      <div class="metric-val">1080 &times; 1920</div>
      <div class="metric-lbl">9:16 Social Video</div>
    </div>
    <div class="metric">
      <div class="metric-val">60.00 FPS</div>
      <div class="metric-lbl">High-Bitrate H.264</div>
    </div>
    <div class="metric">
      <div class="metric-val">&lt; 8 Seconds</div>
      <div class="metric-lbl">Local Render Duration</div>
    </div>
  </div>
</div>
</body>
</html>
