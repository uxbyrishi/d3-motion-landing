<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Card Motion &mdash; 60fps D3motion Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B0D13;
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    .viewport {
      width: 1280px;
      height: 720px;
      background: #11141E;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
    }
    .cards-container {
      position: relative;
      width: 440px;
      height: 280px;
    }
    .motion-card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #1A1F2E 0%, #131722 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(12px);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(59, 98, 246, 0.15);
      color: #60A5FA;
      border: 1px solid rgba(59, 98, 246, 0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .card-val {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-top: 12px;
      color: #FFFFFF;
    }
    .card-label {
      font-size: 14px;
      color: #8E95A2;
      margin-top: 4px;
    }
    .card-metric {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #22C55E;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud {
      position: absolute;
      top: 36px;
      left: 48px;
      display: flex;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #8E95A2;
    }
    .hud-tag {
      background: rgba(255,255,255,0.05);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="hud">
      <div class="hud-tag">GSAP 3.12 Engine</div>
      <div class="hud-tag" id="timecode">00:00:00</div>
      <div class="hud-tag" style="color: #60A5FA;">60 FPS Deterministic</div>
    </div>

    <div class="cards-container">
      <div class="motion-card card-3">
        <div class="card-top">
          <div class="card-chip">Analytics Tier</div>
          <span style="color:#64748B;">&bull;&bull;&bull;</span>
        </div>
        <div>
          <div class="card-val">+99.4%</div>
          <div class="card-label">Deterministic Frame Stability</div>
        </div>
        <div class="card-metric">&uarr; Ultra-Low Jitter Clock</div>
      </div>

      <div class="motion-card card-2">
        <div class="card-top">
          <div class="card-chip" style="background:rgba(168,85,247,0.15); color:#C084FC; border-color:rgba(168,85,247,0.3);">GPU Pipeline</div>
          <span style="color:#64748B;">&bull;&bull;&bull;</span>
        </div>
        <div>
          <div class="card-val">0 Cloud Credits</div>
          <div class="card-label">Local Hardware Acceleration</div>
        </div>
        <div class="card-metric">&uarr; 100% Offline Renders</div>
      </div>

      <div class="motion-card card-1">
        <div class="card-top">
          <div class="card-chip" style="background:rgba(34,197,94,0.15); color:#4ADE80; border-color:rgba(34,197,94,0.3);">Export Ready</div>
          <span style="color:#64748B;">&bull;&bull;&bull;</span>
        </div>
        <div>
          <div class="card-val">4K 60FPS</div>
          <div class="card-label">Direct MP4 Video Stream</div>
        </div>
        <div class="card-metric">&uarr; Broadcast Standard</div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ repeat: -1, yoyo: true });

    tl.set(".card-1", { zIndex: 3, y: 0, scale: 1, opacity: 1 })
      .set(".card-2", { zIndex: 2, y: -24, scale: 0.94, opacity: 0.75 })
      .set(".card-3", { zIndex: 1, y: -48, scale: 0.88, opacity: 0.5 });

    tl.to(".card-1", {
      y: 120,
      opacity: 0,
      scale: 1.05,
      duration: 1.2,
      ease: "power3.inOut"
    })
    .to(".card-2", {
      y: 0,
      scale: 1,
      opacity: 1,
      zIndex: 3,
      duration: 1.2,
      ease: "power3.inOut"
    }, "-=1.0")
    .to(".card-3", {
      y: -24,
      scale: 0.94,
      opacity: 0.75,
      zIndex: 2,
      duration: 1.2,
      ease: "power3.inOut"
    }, "-=1.0")
    .set(".card-1", { y: -48, scale: 0.88, zIndex: 1 })
    .to(".card-1", { opacity: 0.5, duration: 0.6, ease: "power2.out" });

    // Timecode tick
    let start = performance.now();
    function tick() {
      const elapsed = (performance.now() - start) / 1000;
      const sec = Math.floor(elapsed) % 60;
      const frames = Math.floor((elapsed * 60) % 60);
      document.getElementById('timecode').textContent = `00:00:${sec < 10 ? '0' + sec : sec}:${frames < 10 ? '0' + frames : frames}`;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
