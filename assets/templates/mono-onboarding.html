<style>

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:radial-gradient(circle at 50% 20%, #1c3524 0%, #0d1a12 100%);

  color:var(--ink);

.bar{position:absolute;top:56px;left:20px;right:20px;height:36px;display:flex;align-items:center}
.back{position:absolute;left:0;width:36px;height:36px;border-radius:12px;background:#fff;box-shadow:0 6px 14px -6px rgba(10,40,20,.3);display:grid;place-items:center;opacity:0;transform:scale(.4);pointer-events:none;transition:.45s var(--sp)}

[data-s="3"] .skip,[data-s="4"] .skip,[data-s="5"] .skip{opacity:0;pointer-events:none}
.hd{position:absolute;top:104px;left:20px;right:20px}
h1{font-size:32px;line-height:1.1;letter-spacing:-1.3px;font-weight:800;margin:0;min-height:36px}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:5px;margin-bottom:-5px}
.w i{display:inline-block;font-style:normal;transform:translateY(115%);transition:transform .65s cubic-bezier(.2,.9,.25,1.15)}
.in .w i{transform:none}

.sub{font-size:13.5px;line-height:1.4;color:#5b6660;margin:10px 0 0;max-width:272px;font-weight:500;transition:.3s}

.art{position:absolute;left:20px;right:20px;top:270px;height:316px;transition:top .8s var(--sp)}
[data-s="3"] .art,[data-s="4"] .art{top:236px}
.blob{position:absolute;left:-14px;top:6px;width:260px;height:200px;background:#D2F17C;border-radius:56% 44% 52% 48%/58% 62% 38% 42%;transform:rotate(-10deg);transition:all 1.1s var(--sp);animation:br 6s ease-in-out infinite}

.fl{opacity:0;transform:translateY(26px) scale(.9);transition:all .6s var(--sp)}

.forms.login .fn{height:0;overflow:hidden;opacity:0}.forms.login .str{display:none}.fn{height:70px;transition:all .5s var(--sp)}

.pre{font-weight:700;font-size:14px;color:var(--ink);padding-right:10px;border-right:1.5px solid #ECECEA}.eyeb{display:grid;place-items:center;color:#6a726d}

.fbot{position:absolute;left:0;right:0;bottom:6px;transition:opacity .3s}.forms.login .fbot{opacity:0;pointer-events:none}

[data-s="4"] .otp input{transform:none}[data-s="4"] .otp input:nth-child(1){transition-delay:.45s}[data-s="4"] .otp input:nth-child(2){transition-delay:.5s}[data-s="4"] .otp input:nth-child(3){transition-delay:.55s}[data-s="4"] .otp input:nth-child(4){transition-delay:.6s}[data-s="4"] .otp input:nth-child(5){transition-delay:.65s}[data-s="4"] .otp input:nth-child(6){transition-delay:.7s}
.otp input:focus{border-color:#59B02C;box-shadow:0 0 0 4px rgba(180,232,92,.4)}.otp input.fill{animation:pop2 .35s var(--sp)}@keyframes pop2{50%{transform:scale(1.18)}}
.otp input.ok{background:#4CAF2A;color:#fff;border-color:#4CAF2A}
.rs{text-align:center;font-size:13px;color:#5b6660;font-weight:500;margin:18px 0 0}

.cta:active:not(:disabled){transform:scale(.97)}

.cta b{position:absolute;right:7px;top:7px;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;transition:opacity .2s}
.sp{position:absolute;inset:0;margin:auto;width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#B4E85C;border-radius:50%;opacity:0;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.cta.load{left:134px;right:134px}.cta.load .lb,.cta.load b{opacity:0}.cta.load .sp{opacity:1}
.rp{position:absolute;border-radius:50%;background:rgba(180,232,92,.45);pointer-events:none;width:20px;height:20px;margin:-10px 0 0 -10px;animation:rpl .55s ease-out forwards;z-index:40}@keyframes rpl{to{transform:scale(5);opacity:0}}

/* 5x5 / 24px Transparent Touch Guide & Ripple Ring */
.touch-guide{
  position:absolute;
  left:0;
  top:0;
  width:24px;
  height:24px;
  margin-left:-12px;
  margin-top:-12px;
  border-radius:50%;
  background:rgba(255,255,255,0.38);
  border:2px solid rgba(255,255,255,0.85);
  box-shadow:0 0 14px rgba(0,0,0,0.25), inset 0 0 6px rgba(255,255,255,0.8);
  backdrop-filter:blur(2px);
  pointer-events:none;
  z-index:100;
  opacity:0;
  transform:translate(-100px,-100px) scale(1);
  transition:transform .45s cubic-bezier(.22,1,.36,1), opacity .3s ease;
}
.touch-guide::after{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:50%;
  background:rgba(255,255,255,0.85);
  box-shadow:0 0 4px rgba(255,255,255,0.9);
}
.touch-guide.tap{
  transform:translate(var(--tx), var(--ty)) scale(0.72) !important;
  background:rgba(180,232,92,0.65);
  border-color:#B4E85C;
  box-shadow:0 0 16px rgba(180,232,92,0.6);
}
.touch-guide.tap::after{
  background:#fff;
}
.touch-ring{

const I=(k,s=16)=>hi(HI[k],s);
$('#logo').innerHTML='<svg width="26" height="22" viewBox="0 0 26 22"><rect x="0" y="5" width="11" height="17" rx="5" fill="#9BDB3C"/><rect x="9" y="0" width="17" height="22" rx="6" fill="#0A4A2B"/><rect x="9" y="0" width="8" height="8" rx="3" fill="#B4E85C"/></svg>MONO';
$('#sbi').innerHTML='<svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="2.2" fill="currentColor"/></svg>';
$('#back').innerHTML=I('back',18);$('#arw').innerHTML=I('arr',18);$('#eye').innerHTML=I('eye',17);$('.cal').innerHTML=I('cal',14);
$('#icA').innerHTML=I('dn',14);$('#icB').innerHTML=I('up',14);$('#riA').innerHTML=I('food',16);$('#riB').innerHTML=I('bag',16);
$('#bk1').innerHTML=I('bag',44);$('#bk2').innerHTML=I('pig',44);

const P=$('#phone');
let S=-1,login=false,hid=false,busy=false,terms=false,tk=0;

const words=t=>{let k=0;return t.split('|').map(l=>l.split(' ').map(w=>`<span class="w"><i style="transition-delay:${k++*70}ms">${w}</i></span>`).join(' ')).join('<br>')};
async function head(el,t){el.classList.remove('in');el.classList.add('out');await sl(el.innerHTML?320:0);el.classList.remove('out');el.innerHTML=words(t);void el.offsetWidth;el.classList.add('in')}
async function swap(t){const h=$('#h1'),s=$('#sub'),my=++tk;h.classList.remove('in');h.classList.add('out');s.classList.add('sw');await sl(h.innerHTML?320:0);if(my!==tk)return;h.classList.remove('out');h.innerHTML=words(t[0]);s.innerHTML=t[1];void h.offsetWidth;h.classList.add('in');s.classList.remove('sw')}
function roll(t){const lb=$('#lb'),k={duration:450,easing:'cubic-bezier(.3,1.2,.5,1)',fill:'forwards'};[...lb.children].forEach(o=>{o.animate([{transform:'none'},{transform:'translateY(-120%)'}],k).onfinish=()=>o.remove()});const n=document.createElement('span');n.textContent=t;lb.appendChild(n);n.animate([{transform:'translateY(120%)'},{transform:'none'}],k)}

const H=[
  ['Know where|your money|stands.','See your balance, track spending, and stay in control — all in one place.','Get Started'],
  ['Make sense|of every rupee.','Understand your spending habits with clear insights and trends.','Continue'],
  ['Turn everyday|spending into|bigger goals.','Save, plan, and reach what matters to you faster.','Create My Account'],
  ['Create your|account.','Join MONO and start tracking every rupee.','Create Account'],
  ['Verify your|number.','Enter the 6-digit code we sent to your mobile.','Verify']
];
const txt=n=>n==3&&login?['Welcome|back.','Log in to pick up right where you left off.','Log In']:H[n];

function count(el,to,fmt=inr,dur=900){
  const from=+el.dataset.v||0,t0=performance.now();
  el.dataset.v=to;
  (function f(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e);
    if(p<1)requestAnimationFrame(f);
  })(t0);
}
async function scramble(el,fin){for(let i=0;i<8;i++){el.textContent='₹ '+Array.from({length:6},()=>Math.random()*10|0).join('');await sl(40)}el.textContent=fin}

const D={
  Day:{l:['Mon','Tue','Wed','Thu','Fri'],a:[1180,860,1640,990,1410],d:[-3,5,9,-6,-2]},
  Week:{l:['W1','W2','W3','W4','W5'],a:[9800,11200,10400,12600,9100],d:[4,8,-7,12,-5]},
  Month:{l:['Jun','Jul','Aug','Sep','Oct'],a:[21400,29800,38100,26500,42300],d:[-4,6,12,-9,-8]}

let per='Month',sel=4;
$('#chart').innerHTML=[0,1,2,3,4].map(i=>`<button class="col" data-i="${i}"><i style="transition-delay:${i*80}ms"></i><span></span></button>`).join('');

function draw(){
  const s=D[per],mx=Math.max(...s.a);
  $$('.col').forEach((c,i)=>{
    c.classList.toggle('on',i==sel);
    c.firstChild.style.height=Math.round(s.a[i]/mx*46)+'px';
    c.lastChild.textContent=s.l[i];

  const t=s.a[sel],d=s.d[sel];
  count($('#amt'),t,inr,500);
  const dl=$('#dl');

  dl.classList.toggle('up',d>0);
  $('#fa').textContent=inr(Math.round(t*.2931/100)*100);
  $('#sa').textContent=inr(Math.round(t*.2104/100)*100);
  $('.th').style.transform=`translateX(${['Day','Week','Month'].indexOf(per)*100}%)`;
  $$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.p==per));
}
$$('.seg button').forEach(b=>b.onclick=()=>{per=b.dataset.p;sel=4;draw()});

$('#cal').onclick=()=>{const k=Object.keys(D);per=k[(k.indexOf(per)+1)%3];sel=4;draw();const r=(+$('#cal').dataset.r||0)+90;$('#cal').dataset.r=r;$('#cal').style.transform=`rotate(${r}deg)`};

const wig=el=>el.animate([{translate:'0'},{translate:'-5px'},{translate:'5px'},{translate:'-3px'},{translate:'0'}],{duration:380});
$('#A').onclick=()=>{wig($('#A'));toast(S==0?'Income is up ₹6,200 from last month':'Food & Dining · '+$('#fa').textContent)};
$('#B').onclick=()=>{wig($('#B'));toast(S==0?'Expenses are down 8% this month':'Shopping · '+$('#sa').textContent)};
$('#eye').onclick=async()=>{hid=!hid;$('#eye').innerHTML=I(hid?'eyeoff':'eye',17);await scramble($('#bn'),hid?'₹ ••••••':'₹2,48,320');$('#bn').dataset.v=248320};

const GR={jp:'linear-gradient(150deg,#F7B6B0,#E8726A 55%,#7B5EA7)',bag:'linear-gradient(150deg,#FFD27D,#F08A5D)',pig:'linear-gradient(150deg,#8FD3C4,#3E8E7E)'};
const setPi=(el,k)=>{el.style.background=GR[k];el.innerHTML=I(k=='jp'?'tgt':k,46)};
const G0=()=>({jp:{t:'Trip to Japan',g:120000,s:86400},bag:{t:'New Wardrobe',g:40000,s:18000},pig:{t:'Emergency Fund',g:200000,s:130000}});
let G=G0(),gc='jp';

function gdraw(img){
  const g=G[gc],p=Math.min(100,Math.round(g.s/g.g*100));
  $('#gt').textContent=g.t;
  $('#gg').textContent=inr(g.g)+' goal';
  count($('#gp'),p,v=>Math.round(v)+'%',600);
  $('#gbar').style.width=p+'%';
  $('#gbd').innerHTML=I(gc,17);
  $$('.rb').forEach(b=>b.classList.toggle('on',b.dataset.g==gc));
  if(img){
    const b=$('#gb2');
    setPi(b,gc);
    b.style.opacity=1;
    b.animate([{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(80% at 50% 50%)'}],{duration:550,easing:'ease-out'}).onfinish=()=>{setPi($('#ga'),gc);b.style.opacity=0};
  }
}
$('#road').onclick=e=>{const b=e.target.closest('.rb');if(b){gc=b.dataset.g;gdraw(1)}};
function coins(el){const r=el.getBoundingClientRect(),p=P.getBoundingClientRect();for(let i=0;i<10;i++)fx(r.left-p.left+r.width/2,r.top-p.top+r.height/2,'#F4C430',60)}
$('#gcard').onclick=()=>{const g=G[gc];if(g.s>=g.g)return toast('Goal reached! 🎉');const a=Math.round(g.g*.05/100)*100;g.s=Math.min(g.g,g.s+a);gdraw();coins($('#gcard'));toast('Added '+inr(a)+' to '+g.t)};

function fx(x,y,c,d=50){
  const s=document.createElement('i');
  s.className='spark';
  s.style.cssText=`left:${x}px;top:${y}px;background:${c}`;

}

const fld=(ic,id,ph,type,pre)=>`<div class="inp" id="w-${id}">${I(ic,18)}${pre?'<span class="pre">+91</span>':''}<input id="${id}" type="${type}" placeholder="${ph}"${pre?' inputmode="numeric" maxlength="10"':''} autocomplete="off">${type=='password'?`<button type="button" class="eyeb" data-t="${id}" aria-label="Show password">${I('eye',18)}</button>`:''}</div><div class="em" id="e-${id}"></div>`;

$('#alt').onclick=()=>{login=!login;$('#forms').classList.toggle('login',login);$('#altq').textContent=login?'New to MONO?':'Already have an account?';$('#alt').textContent=login?'Sign up':'Log in';const t=txt(3);swap(t);roll(t[2])};

let ti,left=0;

function tick(){$('#rs').innerHTML=left>0?'Resend code in <b>0:'+String(left).padStart(2,'0')+'</b>':'Didn’t get a code? <button class="lnk" id="rsb">Resend</button>';const b=$('#rsb');if(b)b.onclick=()=>{startT();toast('A new code is on its way')}}
function startT(){clearInterval(ti);left=30;tick();ti=setInterval(()=>{left--;tick();if(left<=0)clearInterval(ti)},1000)}
const upd=()=>{$('#cta').disabled=S==4&&code().length<6};

bx.forEach((b,i)=>{
  b.oninput=()=>{
    b.value=b.value.replace(/\D/g,'').slice(-1);
    if(b.value){
      b.classList.add('fill');
      setTimeout(()=>b.classList.remove('fill'),400);
      bx[i+1]&&bx[i+1].focus();
    }
    upd();
  };
  b.onkeydown=e=>{
    if(e.key==='Backspace'&&!b.value&&bx[i-1]){bx[i-1].focus();bx[i-1].value='';upd()}
    if(e.key==='Enter')$('#cta').click();
  };
  b.onpaste=e=>{
    e.preventDefault();
    const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);
    [...t].forEach((c,k)=>bx[k].value=c);
    bx[Math.min(t.length,5)].focus();

  };
});

let otpSub='';
async function go(n){
  if(n==S)return;
  S=n;
  P.dataset.s=n;
  clearInterval(ti);
  $$('.dots i').forEach((d,i)=>d.classList.toggle('on',i==n));

    return;
  }
  const t=txt(n);
  swap([t[0],n==4?otpSub:t[1]]);
  roll(t[2]);
  $('#cta').disabled=n==4&&code().length<6;
  if(n==0)setTimeout(()=>count($('#bn'),248320,v=>hid?'₹ ••••••':inr(v),1100),500);
  if(n==1){$('#amt').dataset.v=0;draw()}

  if(n==4){startT();setTimeout(()=>bx[0].focus({preventScroll:true}),900)}
}

  bx.forEach(b=>{b.value='';b.classList.remove('ok')});

      {transform:'none',opacity:1},
      {transform:'translateX(26px)',opacity:0,offset:.5},

      {transform:'none',opacity:1}

  const b=$('#cta');

/* Confetti Physics Engine */
function confetti(){
  const c=$('#cv'),x=c.getContext('2d'),cols=['#B4E85C','#DDD6F7','#FFB3AE','#fff','#D2F17C'];
  const ps=Array.from({length:140},()=>({
    x:160,
    y:440,
    vx:(Math.random()-.5)*16,
    vy:-Math.random()*18-6,
    r:Math.random()*6,
    vr:(Math.random()-.5)*.35,
    w:5+Math.random()*6,
    h:3+Math.random()*5,
    c:cols[Math.random()*5|0],
    coin:Math.random()<.25,
    opacity:1
  }));
  let f=0;
  (function a(){
    x.clearRect(0,0,320,686);
    ps.forEach(p=>{
      p.vy+=.32;
      p.x+=p.vx;
      p.y+=p.vy;
      p.vx*=.99;
      p.r+=p.vr;
      if(f>180) p.opacity=Math.max(0, p.opacity-0.015);
      x.save();
      x.globalAlpha=p.opacity;
      x.translate(p.x,p.y);
      x.rotate(p.r);
      x.fillStyle=p.coin?'#F4C430':p.c;
      if(p.coin){
        x.beginPath();
        x.arc(0,0,4.5,0,7);
        x.fill();
      }else{
        x.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      }
      x.restore();
    });
    if(++f<260) requestAnimationFrame(a);
    else x.clearRect(0,0,320,686);
  })();
}

/* ==========================================================================
   TRANSPARENT 5x5 SCREEN TOUCH GUIDE CONTROLLER
   ========================================================================== */
const tg = $('#touchGuide');
let curTx = 160, curTy = 400;

async function moveTouch(x, y, dur=420){
  curTx = Math.round(x);
  curTy = Math.round(y);
  tg.style.setProperty('--tx', `${curTx}px`);
  tg.style.setProperty('--ty', `${curTy}px`);
  tg.style.opacity = '1';
  tg.style.transform = `translate(${curTx}px, ${curTy}px) scale(1)`;
  await sl(dur);
}

async function tapTouch(){
  tg.classList.add('tap');
  const ring = document.createElement('div');
  ring.className = 'touch-ring';
  ring.style.left = curTx + 'px';
  ring.style.top = curTy + 'px';
  P.appendChild(ring);
  setTimeout(()=>ring.remove(), 450);
  await sl(160);
  tg.classList.remove('tap');
  await sl(100);
}

async function touchTo(el, doTap=true, postDelay=250){
  if(!el) return;
  const pRect = P.getBoundingClientRect();
  const eRect = el.getBoundingClientRect();
  const targetX = eRect.left - pRect.left + eRect.width / 2;
  const targetY = eRect.top - pRect.top + eRect.height / 2;
  await moveTouch(targetX, targetY);
  if(doTap){
    await tapTouch();
    if(typeof el.click === 'function') el.click();
  }
  if(postDelay) await sl(postDelay);
}

async function typeInto(input, text, speed=40){
  await touchTo(input, true, 80);
  input.focus();
  input.value='';
  for(let i=0;i<text.length;i++){
    input.value+=text[i];
    input.dispatchEvent(new Event('input',{bubbles:true}));
    await sl(speed);
  }
  await sl(120);
}

/* ==========================================================================
   ENDLESS CHOREOGRAPHED WALKTHROUGH WITH TOUCH GUIDE
   ========================================================================== */
async function runLoop(){
  while(true){
    // ----------------------------------------------------
    // SCREEN 0: Balance & Financial Overview
    // ----------------------------------------------------
    reset();
    await sl(1200);

    // Single clean interaction on Screen 0: Tap Eye toggle to scramble/peek
    await touchTo($('#eye'), true, 650);

    // Tap CTA "Get Started" to advance
    await touchTo($('#cta'), true, 500);
    await sl(600);

    // ----------------------------------------------------
    // SCREEN 1: Spending Analytics & Chart
    // ----------------------------------------------------
    await sl(900);

    // 1. Switch to Week view
    const segWeek = $$('.seg button')[1];
    await touchTo(segWeek, true, 600);

    // 2. Select a bar column in the chart
    const col3 = $$('.col')[2];
    if(col3) await touchTo(col3, true, 650);

    // 3. Tap CTA "Continue" to advance
    await touchTo($('#cta'), true, 500);
    await sl(600);

    // ----------------------------------------------------
    // SCREEN 2: Savings Goals & Milestones (3rd screen) - FIXED & SMOOTH
    // ----------------------------------------------------
    // 1. Wait for road milestones and goal progress bar to fully settle into place
    await sl(1600);

    // 2. Tap Goal Card to add savings (+5% boost with coin sparkle ripple)
    await touchTo($('#gcard'), true, 950);

    // 3. Tap Roadmap milestone to switch goal smoothly (Emergency Fund)
    const rbPig = $('.rb[data-g="pig"]');
    if(rbPig) await touchTo(rbPig, true, 900);

    // 4. Tap CTA "Create My Account" to advance
    await touchTo($('#cta'), true, 500);
    await sl(600);

    // ----------------------------------------------------
    // SCREEN 3: Sign Up Form Auto-Type
    // ----------------------------------------------------
    await sl(800);

    // 1. Touch and type Name
    await typeInto($('#sn'), 'Alex Morgan', 40);

    // 2. Touch and type Phone
    await typeInto($('#sp'), '9876543210', 40);

    // 3. Touch and type Password
    await typeInto($('#spw'), 'MonoPass@2026', 40);

    // 4. Touch Terms & Conditions checkbox
    if(!terms) await touchTo($('#terms'), true, 450);

    // 5. Tap CTA "Create Account"
    await touchTo($('#cta'), true, 750);
    await sl(800);

    // ----------------------------------------------------
    // SCREEN 4: OTP Verification (FIXED: Touch only first box, digits stream in)
    // ----------------------------------------------------
    await sl(800);

    // 1. Touch only the FIRST box once
    await touchTo(bx[0], true, 180);

    // 2. Glide touch guide towards Verify button (no box-by-box cursor following)
    const pRect = P.getBoundingClientRect();
    const ctaRect = $('#cta').getBoundingClientRect();
    const ctaX = ctaRect.left - pRect.left + ctaRect.width / 2;
    const ctaY = ctaRect.top - pRect.top + ctaRect.height / 2;
    moveTouch(ctaX, ctaY, 550);

    // 3. Digits stream into OTP boxes sequentially with pop animation
    const codeDigits = ['8','4','2','9','1','5'];
    for(let i=0; i<6; i++){
      const box = bx[i];
      box.value = codeDigits[i];
      box.classList.add('fill');
      box.dispatchEvent(new Event('input', {bubbles:true}));
      await sl(120);
      box.classList.remove('fill');
    }

    await sl(350);
    // 4. Tap CTA "Verify"
    await touchTo($('#cta'), true, 950);

    // ----------------------------------------------------
    // SCREEN 5: Celebration & Finale
    // ----------------------------------------------------
    await sl(2200);

    // 1. Touch "Go to dashboard" button
    await touchTo($('#dash'), true, 900);

    // 2. Celebrate with confetti rain
    await sl(2600);

    // 3. Touch "↺ Replay" button to seamlessly loop
    await touchTo($('#rpl'), true, 500);
    await sl(400);
  }
}

// Boot and Launch
setPi($('#ga'),'jp');
go(0);
setTimeout(()=>P.classList.remove('boot'),500);
setTimeout(()=>runLoop(),1000);
