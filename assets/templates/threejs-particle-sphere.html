<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js WebGL Sphere &mdash; 60fps D3motion Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #08090D;
      color: #FFFFFF;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #stage-container {
      width: 1280px;
      height: 720px;
      position: relative;
      background: #0B0E14;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0,0,0,0.85);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: absolute;
      bottom: 40px;
      left: 48px;
      pointer-events: none;
      z-index: 10;
    }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #60A5FA;
      background: rgba(59, 98, 246, 0.15);
      border: 1px solid rgba(59, 98, 246, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    p {
      color: #8E95A2;
      font-size: 15px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <canvas id="webgl"></canvas>
    <div class="overlay">
      <div class="badge">THREE.JS r128 WEBGL</div>
      <h1>Deterministic Quantum Lattice</h1>
      <p>Synchronized frame stepping rendered without WebGL context stutter</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('webgl');
    const width = 1280;
    const height = 720;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.z = 240;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio > 1 ? 2 : 1);

    // Particle Sphere
    const particleCount = 2800;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const color1 = new THREE.Color(0x3B62F6);
    const color2 = new THREE.Color(0xA855F7);

    for (let i = 0; i < particleCount; i++) {
      const phi = Math.acos(-1 + (2 * i) / particleCount);
      const theta = Math.sqrt(particleCount * Math.PI) * phi;
      const radius = 75 + (Math.sin(i * 0.2) * 5);

      positions[i * 3] = radius * Math.cos(theta) * Math.sin(phi);
      positions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
      positions[i * 3 + 2] = radius * Math.cos(phi);

      const mixed = color1.clone().lerp(color2, Math.sin(phi));
      colors[i * 3] = mixed.r;
      colors[i * 3 + 1] = mixed.g;
      colors[i * 3 + 2] = mixed.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 3.5,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // Deterministic loop (works both in browser and inside D3motion virtual clock)
    let clock = 0;
    function renderFrame() {
      clock += 0.015;
      particles.rotation.y = clock * 0.8;
      particles.rotation.x = clock * 0.4;
      particles.rotation.z = Math.sin(clock * 0.5) * 0.2;

      renderer.render(scene, camera);
      requestAnimationFrame(renderFrame);
    }
    renderFrame();
  </script>
</body>
</html>
