<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphing UI Loop — 1440x1440 Closed-Form Spring Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background-color: #111113;
    color: #e4e4e7;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 24px;
    user-select: none;
    overflow-x: hidden;
  }

  /* Main 1440x1440 Canvas Viewport */
  #viewport-wrapper {
    position: relative;
    width: 1440px;
    height: 1440px;
    max-width: 92vw;
    max-height: 92vw;
    aspect-ratio: 1 / 1;
    background: #EAEAE6; /* Light warm-gray canvas */
    border-radius: 28px;
    box-shadow: 0 32px 80px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
    overflow: hidden;
    position: relative;
  }

  /* Internal absolute 1440x1440 coordinate plane */
  #canvas-plane {
    position: absolute;
    top: 0;
    left: 0;
    width: 1440px;
    height: 1440px;
    transform-origin: 0 0;
    /* Subtly textured background grid */
    background-image: 
      radial-gradient(#d6d6d0 1.2px, transparent 1.2px);
    background-size: 32px 32px;
  }

  /* Camera Layer: Zoom & Pan around center */
  /* NOTE: NO will-change on camera or morphing containers to preserve sharp font rendering */
  #camera-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 1440px;
    height: 1440px;
    transform-origin: 720px 720px;
  }

  /* Center Anchor */
  #anchor-point {
    position: absolute;
    top: 720px;
    left: 720px;
    width: 0;
    height: 0;
  }

  /* THE SINGLE MORPHING CONTAINER: All states live inside this one element */
  #morph-container {
    position: absolute;
    top: 0;
    left: 0;
    transform: translate(-50%, -50%);
    background: #09090b;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 
      0 24px 50px -12px rgba(0, 0, 0, 0.35),
      0 8px 16px -6px rgba(0, 0, 0, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* High contrast content layer inside container */
  .state-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    /* Blur and opacity computed dynamically inside seek(t) */
  }

  /* State 1: Button */
  #layer-button {
    font-size: 17px;
    font-weight: 550;
    letter-spacing: -0.01em;
    color: #ffffff;
    gap: 10px;
  }

  /* State 2: Loader */
  #layer-loader svg {
    width: 32px;
    height: 32px;
  }

  /* State 3: Checkmark */
  #layer-check svg {
    width: 32px;
    height: 32px;
  }

  /* State 4: Dynamic Island */
  #layer-island {
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  /* State 5: Music Player */
  #layer-player {
    padding: 20px 24px;
    flex-direction: column;
    justify-content: space-between;
    width: 100%;
    height: 100%;
  }

  /* State 6: Volume Slider */
  #layer-volume {
    padding: 0 24px;
    display: flex;
    align-items: center;
    width: 100%;
    height: 100%;
    gap: 16px;
  }

  /* State 7: Toggle Switch */
  #layer-toggle {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
  }

  /* State 8: Segmented Tabs */
  #layer-tabs {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 6px;
    position: relative;
  }

  /* State 9: Interactive Chart */
  #layer-chart {
    width: 100%;
    height: 100%;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  /* State 10: Command Palette */
  #layer-cmdk {
    width: 100%;
    height: 100%;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
  }

  /* State 11: Toast */
  #layer-toast {
    padding: 0 20px;
    display: flex;
    align-items: center;
    width: 100%;
    height: 100%;
    gap: 12px;
    font-size: 15px;
    font-weight: 500;
  }

  /* Interactive Cursor */
  #cursor {
    position: absolute;
    top: 0;
    left: 0;
    width: 24px;
    height: 24px;
    pointer-events: none;
    z-index: 9999;
    transform-origin: 2px 2px;
  }

  /* Bottom Inspector & Controls Bar */
  #inspector-bar {
    margin-top: 20px;
    width: 1440px;
    max-width: 92vw;
    background: #18181b;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .timeline-row {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
  }

  #scrubber {
    flex: 1;
    appearance: none;
    height: 8px;
    background: #27272a;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  #scrubber::-webkit-slider-thumb {
    appearance: none;
    width: 16px;
    height: 16px;
    background: #ffffff;
    border-radius: 50%;
    cursor: grab;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-family: 'Geist Mono', monospace;
    color: #a1a1aa;
  }

  .button-group {
    display: flex;
    gap: 8px;
  }

  .ctrl-btn {
    background: #27272a;
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 14px;
    border-radius: 8px;
    font-family: 'Geist', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .ctrl-btn:hover {
    background: #3f3f46;
  }
  .ctrl-btn.active {
    background: #ffffff;
    color: #000000;
  }

  /* Beat grid indicators */
  #beat-track {
    display: flex;
    height: 18px;
    width: 100%;
    gap: 2px;
    margin-top: 4px;
  }
  .beat-segment {
    flex: 1;
    background: #27272a;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }
  .beat-segment.downbeat {
    background: #3f3f46;
  }
  .beat-segment.active {
    background: #38bdf8;
  }
</style>
</head>

<script>
/**
 * CLOSED-FORM SPRING MATHEMATICS
 * Harmonic step response: pure function of delta time (t - t0).
 * No state accumulation, no Euler integration, zero drift across loops.
 */
function springStep(dt, delta, omega = 20, zeta = 0.88) {
  if (dt <= 0) return 0;
  if (zeta >= 1.0) {
    return delta * (1 - Math.exp(-omega * dt) * (1 + omega * dt));
  }
  const wd = omega * Math.sqrt(1 - zeta * zeta);
  const decay = Math.exp(-zeta * omega * dt);
  const response = 1 - decay * (Math.cos(wd * dt) + (zeta * omega / wd) * Math.sin(wd * dt));
  return delta * response;
}

/**
 * Multi-target spring step superposition:
 * targets: array of [t_timestamp, target_value, omega, zeta]
 */
function multiSpring(t, baseVal, steps) {
  let val = baseVal;
  for (let i = 0; i < steps.length; i++) {
    const [tStep, targetVal, omega, zeta] = steps[i];
    const prevTarget = i === 0 ? baseVal : steps[i - 1][1];
    const delta = targetVal - prevTarget;
    val += springStep(t - tStep, delta, omega || 20, zeta || 0.88);
  }
  return val;
}

/**
 * Hermite Smoothstep for soft cross-fades and blurs
 */
function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

// Precompute Chart Spline Path
const CHART_POINTS = [
  [10, 125], [70, 110], [140, 85], [210, 95], [280, 50], [350, 60], [380, 35], [440, 48], [490, 25]
];
function createSmoothPath(points) {
  let d = `M ${points[0][0]} ${points[0][1]}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i === 0 ? 0 : i - 1];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2] || p2;
    const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
    const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
    const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
    const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
const CHART_LINE_PATH = createSmoothPath(CHART_POINTS);

/**
 * PURE FUNCTION seek(t):
 * Computes exact state at any time t in [0.0, 14.0]
 */
window.seek = function(t) {
  // Wrap exactly at TOTAL_DURATION for infinite seamless loop
  t = ((t % TOTAL_DURATION) + TOTAL_DURATION) % TOTAL_DURATION;

  // Base dimensions via closed-form spring superposition
  let w = multiSpring(t, 240, WIDTH_STEPS);
  let h = multiSpring(t, 64, HEIGHT_STEPS);
  let r = multiSpring(t, 32, RADIUS_STEPS);
  let zoom = multiSpring(t, 2.4, CAMERA_ZOOM_STEPS);

  // Apply Volume Overstretch Direct Manipulation (Beat 10: 4.5s to 5.5s)
  if (t >= 4.5 && t < 5.5) {
    // cursor drags past max volume thumb
    const stretchProgress = smoothstep(4.5, 4.85, t) * (1 - smoothstep(5.0, 5.35, t));
    const stretchAmount = 45 * stretchProgress;
    w += stretchAmount; // stretches horizontally
  }

  // Camera transform (sharp scaling, no will-change)
  cameraLayer.style.transform = `scale(${zoom})`;

  // Morph Container geometry
  morphContainer.style.width = `${w.toFixed(2)}px`;
  morphContainer.style.height = `${h.toFixed(2)}px`;
  morphContainer.style.borderRadius = `${r.toFixed(2)}px`;

  // Morph Container theme/background
  // Standard: pure black (#09090b). Toggle state at 6.0-6.5s switches to high contrast
  let bgR = 9, bgG = 9, bgB = 11;
  morphContainer.style.background = `rgb(${bgR}, ${bgG}, ${bgB})`;

  // Helper for crossfade + micro-blur swap
  function setLayerStyle(el, activeStart, activeEnd, fadeInDur = 0.15, fadeOutDur = 0.15) {
    let opacity = 0;
    if (t >= activeStart - fadeInDur && t <= activeEnd + fadeOutDur) {
      if (t < activeStart) {
        opacity = smoothstep(activeStart - fadeInDur, activeStart, t);
      } else if (t > activeEnd) {
        opacity = 1 - smoothstep(activeEnd, activeEnd + fadeOutDur, t);
      } else {
        opacity = 1;
      }
    }
    const blur = (1 - opacity) * 6;
    el.style.opacity = opacity.toFixed(3);
    el.style.filter = blur > 0.1 ? `blur(${blur.toFixed(1)}px)` : 'none';
    el.style.display = opacity <= 0.001 ? 'none' : 'flex';
    return opacity;
  }

  // 1. Button (0.0s - 0.5s & 13.5s - 14.0s)
  const isBtnLoopEnd = t >= 13.5;
  const opBtn = isBtnLoopEnd 
    ? smoothstep(13.4, 13.8, t) 
    : (1 - smoothstep(0.42, 0.60, t));
  layerButton.style.opacity = opBtn.toFixed(3);
  layerButton.style.filter = opBtn < 0.99 ? `blur(${((1 - opBtn) * 6).toFixed(1)}px)` : 'none';
  layerButton.style.display = opBtn <= 0.001 ? 'none' : 'flex';

  // 2. Loader (0.5s - 1.0s)
  const opLoader = setLayerStyle(layerLoader, 0.58, 0.95, 0.12, 0.12);
  if (opLoader > 0.01) {
    const rot = (t - 0.5) * 720; // 2 revolutions per second
    loaderSpinner.style.transformOrigin = '18px 18px';
    loaderSpinner.style.transform = `rotate(${rot.toFixed(1)}deg)`;
  }

  // 3. Checkmark (1.0s - 1.5s)
  const opCheck = setLayerStyle(layerCheck, 1.05, 1.45, 0.10, 0.12);
  if (opCheck > 0.01) {
    const drawProg = clamp(springStep(t - 1.05, 1.0, 24, 0.9), 0, 1);
    checkPath.style.strokeDashoffset = (checkTotalLength * (1 - drawProg)).toFixed(1);
  }

  // 4. Dynamic Island (1.5s - 2.0s)
  setLayerStyle(layerIsland, 1.55, 1.95, 0.12, 0.12);

  // 5. Music Player (2.0s - 4.0s)
  const opPlayer = setLayerStyle(layerPlayer, 2.08, 3.92, 0.15, 0.15);
  if (opPlayer > 0.01) {
    // Play / Pause Icon morph at Beat 6 (2.5s)
    const isPaused = t >= 2.65;
    if (isPaused) {
      playPoly.style.display = 'none';
      pauseBar1.style.display = 'block';
      pauseBar2.style.display = 'block';
    } else {
      playPoly.style.display = 'block';
      pauseBar1.style.display = 'none';
      pauseBar2.style.display = 'none';
    }

    // Direct scrub interaction (Beat 7-8: 3.0s to 3.8s)
    let scrubPct = 0.28;
    if (t >= 3.1 && t <= 3.7) {
      // Cursor drags scrub thumb from 28% to 76%
      const p = smoothstep(3.1, 3.7, t);
      scrubPct = 0.28 + p * 0.48;
    } else if (t > 3.7) {
      scrubPct = 0.76;
    }
    playerFill.style.width = `${(scrubPct * 100).toFixed(1)}%`;
    playerThumb.style.left = `${(scrubPct * 100).toFixed(1)}%`;
    const curSec = Math.floor(scrubPct * 243);
    const m = Math.floor(curSec / 60);
    const s = curSec % 60;
    playerTimeCur.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  // 6. Volume Slider (4.0s - 5.5s)
  const opVolume = setLayerStyle(layerVolume, 4.08, 5.42, 0.15, 0.15);
  if (opVolume > 0.01) {
    let volVal = 0.65;
    if (t >= 4.5 && t < 5.0) {
      // Drag past max (overdrag up to 1.15)
      const p = smoothstep(4.5, 4.9, t);
      volVal = 0.65 + p * 0.50; // up to 1.15
    } else if (t >= 5.0 && t < 5.5) {
      // Snaps back from 1.15 to 1.0 on release
      volVal = 1.0 + springStep(t - 5.0, -0.15, 24, 0.85);
    }
    const displayVal = Math.min(100, Math.round(volVal * 100));
    const thumbX = Math.min(100, volVal * 100);
    volFill.style.width = `${clamp(thumbX, 0, 100).toFixed(1)}%`;
    volThumb.style.left = `${clamp(thumbX, 0, 100).toFixed(1)}%`;
    volText.textContent = `${displayVal}%`;
  }

  // 7. Toggle Switch (5.5s - 6.5s)
  const opToggle = setLayerStyle(layerToggle, 5.58, 6.42, 0.12, 0.12);
  if (opToggle > 0.01) {
    // DUAL-SPRING ASYMMETRIC EDGES FOR LIQUID TOGGLE KNOB
    // Leading right edge springs faster than trailing left edge!
    const tFlip = 6.0;
    let leadingX = 8;
    let trailingX = 8;
    const travelDist = 72; // width 144 - knob width 56 - padding
    if (t >= tFlip) {
      // Right edge moves with fast spring (omega 24, zeta 0.86)
      leadingX = 8 + springStep(t - tFlip, travelDist, 24, 0.86);
      // Left edge moves with lag spring (omega 17, zeta 0.90)
      trailingX = 8 + springStep(t - tFlip, travelDist, 17, 0.90);
    }
    const knobLeft = trailingX;
    const knobWidth = Math.max(56, 56 + (leadingX - trailingX));
    toggleKnob.style.left = `${knobLeft.toFixed(1)}px`;
    toggleKnob.style.width = `${knobWidth.toFixed(1)}px`;

    // High contrast container fill shift on toggle
    const toggleFillProg = t >= tFlip ? clamp(springStep(t - tFlip, 1.0, 20, 0.9), 0, 1) : 0;
    toggleHousing.style.background = toggleFillProg > 0.5 ? '#ffffff' : '#27272a';
    toggleKnob.style.background = toggleFillProg > 0.5 ? '#000000' : '#ffffff';
  }

  // 8. Segmented Tabs (6.5s - 8.0s)
  const opTabs = setLayerStyle(layerTabs, 6.58, 7.92, 0.12, 0.12);
  if (opTabs > 0.01) {
    // 3 Tabs: positions at ~6px, 158px, 310px (width ~148px)
    const tabWidth = 146;
    const posTab0 = 6;
    const posTab1 = 156;
    const posTab2 = 306;

    // Asymmetric dual-spring for tab indicator pill:
    // Leading edge expands forward, trailing edge catches up!
    let pillLeft = posTab0;
    let pillRight = posTab0 + tabWidth;

    const tClick1 = 7.0; // Click Tab 2
    const tClick2 = 7.5; // Click Tab 3

    if (t < tClick1) {
      pillLeft = posTab0;
      pillRight = posTab0 + tabWidth;
      tabItems[0].style.color = '#000000';
      tabItems[1].style.color = '#a1a1aa';
      tabItems[2].style.color = '#a1a1aa';
    } else if (t < tClick2) {
      // Moving from Tab 1 to Tab 2
      const rightTarget = posTab1 + tabWidth;
      const leftTarget = posTab1;
      // Leading (right) edge uses snappy spring (omega 24, zeta 0.85)
      pillRight = (posTab0 + tabWidth) + springStep(t - tClick1, rightTarget - (posTab0 + tabWidth), 24, 0.85);
      // Trailing (left) edge uses lag spring (omega 17, zeta 0.90)
      pillLeft = posTab0 + springStep(t - tClick1, leftTarget - posTab0, 17, 0.90);

      const isPastHalf = t > tClick1 + 0.12;
      tabItems[0].style.color = isPastHalf ? '#a1a1aa' : '#000000';
      tabItems[1].style.color = isPastHalf ? '#000000' : '#a1a1aa';
      tabItems[2].style.color = '#a1a1aa';
    } else {
      // Moving from Tab 2 to Tab 3
      const rightTarget = posTab2 + tabWidth;
      const leftTarget = posTab2;
      pillRight = (posTab1 + tabWidth) + springStep(t - tClick2, rightTarget - (posTab1 + tabWidth), 24, 0.85);
      pillLeft = posTab1 + springStep(t - tClick2, leftTarget - posTab1, 17, 0.90);

      const isPastHalf = t > tClick2 + 0.12;
      tabItems[0].style.color = '#a1a1aa';
      tabItems[1].style.color = isPastHalf ? '#a1a1aa' : '#000000';
      tabItems[2].style.color = isPastHalf ? '#000000' : '#a1a1aa';
    }

    tabsLiquidPill.style.left = `${pillLeft.toFixed(1)}px`;
    tabsLiquidPill.style.width = `${Math.max(tabWidth, pillRight - pillLeft).toFixed(1)}px`;
  }

  // 9. Interactive Chart (8.0s - 10.0s)
  const opChart = setLayerStyle(layerChart, 8.08, 9.92, 0.15, 0.15);
  if (opChart > 0.01) {
    // Sparkline draws itself on Beat 18 (8.5s)
    const drawProg = clamp(springStep(t - 8.35, 1.0, 18, 0.92), 0, 1);
    chartStroke.style.strokeDashoffset = (chartTotalLength * (1 - drawProg)).toFixed(1);
    chartArea.style.opacity = drawProg.toFixed(2);

    // Tooltip & Hairline pop on Beat 19 (9.0s to 9.6s)
    let tipOpacity = 0;
    if (t >= 9.0 && t <= 9.65) {
      tipOpacity = smoothstep(9.0, 9.2, t) * (1 - smoothstep(9.5, 9.65, t));
    }
    chartHairline.style.opacity = tipOpacity.toFixed(2);
    chartTargetDot.style.opacity = tipOpacity.toFixed(2);
    chartTooltip.style.opacity = tipOpacity.toFixed(2);
    if (tipOpacity > 0.01) {
      const scale = 0.8 + 0.2 * tipOpacity;
      chartTooltip.style.transform = `translate(-50%, -100%) scale(${scale.toFixed(2)})`;
    }
  }

  // 10. Command Palette ⌘K (10.0s - 12.0s)
  const opCmdk = setLayerStyle(layerCmdk, 10.08, 11.92, 0.15, 0.15);
  if (opCmdk > 0.01) {
    // Type query: "deploy prod" (Beat 22: 10.5s - 11.2s)
    const fullText = "deploy prod";
    const typeProg = clamp((t - 10.5) / 0.65, 0, 1);
    const charsCount = Math.floor(typeProg * fullText.length);
    cmdkTypedText.textContent = fullText.slice(0, charsCount);

    // Blinking Caret
    const caretVis = Math.sin(t * 12) > 0 ? 'inline-block' : 'none';
    document.getElementById('cmdk-caret').style.display = caretVis;

    // Item selection flash at Beat 24 (11.5s)
    if (t >= 11.5) {
      cmdkItem0.style.background = '#ffffff';
      cmdkItem0.style.color = '#000000';
    } else {
      cmdkItem0.style.background = '#27272a';
      cmdkItem0.style.color = '#ffffff';
    }
  }

  // 11. Toast (12.0s - 13.0s)
  const opToast = setLayerStyle(layerToast, 12.08, 12.92, 0.12, 0.12);
  if (opToast > 0.01) {
    // Depleting timer bar
    const toastTimeProg = clamp(1 - (t - 12.1) / 0.85, 0, 1);
    toastProgress.style.width = `${(toastTimeProg * 100).toFixed(1)}%`;
  }

  // CURSOR INTERACTION TRAJECTORY: Analytical Closed-Form Coordinates (x(t), y(t))
  // The cursor arrives precisely at interaction hot spots on beat downbeats
  let curX = 720;
  let curY = 720;
  let curPress = false;

  // Exact trajectory piecewise functions
  if (t < 0.5) {
    // Beat 1: Button click
    curX = 720;
    curY = 720;
    curPress = (t >= 0.08 && t <= 0.28);
  } else if (t < 1.5) {
    // Loader & Check: cursor backs away slightly
    curX = 720 + 35 * smoothstep(0.5, 0.9, t);
    curY = 720 + 35 * smoothstep(0.5, 0.9, t);
  } else if (t < 2.5) {
    // Dynamic island & approach Music Player Play Button
    // Play button center in 1440 canvas is ~ (870, 680)
    const p = smoothstep(1.8, 2.4, t);
    curX = 755 + p * (870 - 755);
    curY = 755 + p * (680 - 755);
  } else if (t < 3.0) {
    // Beat 6: Play / Pause click at (870, 680)
    curX = 870;
    curY = 680;
    curPress = (t >= 2.62 && t <= 2.80);
  } else if (t < 3.5) {
    // Beat 7: Cursor moves to scrubber playhead thumb at ~ (630, 765)
    const p = smoothstep(3.0, 3.25, t);
    curX = 870 + p * (630 - 870);
    curY = 680 + p * (765 - 680);
    curPress = t >= 3.25;
  } else if (t < 4.0) {
    // Beat 8: Cursor drags scrubber from (630, 765) to (820, 765)
    const p = smoothstep(3.25, 3.75, t);
    curX = 630 + p * (820 - 630);
    curY = 765;
    curPress = t <= 3.75;
  } else if (t < 4.5) {
    // Move to Volume Slider thumb at ~ (770, 720)
    const p = smoothstep(4.0, 4.35, t);
    curX = 820 + p * (770 - 820);
    curY = 765 + p * (720 - 765);
  } else if (t < 5.2) {
    // Beat 10: Drag volume slider thumb past max to (880, 720) - Overstretch!
    const p = smoothstep(4.5, 4.85, t);
    curX = 770 + p * (880 - 770);
    curY = 720;
    curPress = (t >= 4.45 && t <= 5.15);
  } else if (t < 5.8) {
    // Move to Toggle Knob at ~ (690, 720)
    const p = smoothstep(5.25, 5.7, t);
    curX = 880 + p * (690 - 880);
    curY = 720;
  } else if (t < 6.5) {
    // Beat 13: Click toggle switch at (690, 720)
    curX = 690;
    curY = 720;
    curPress = (t >= 5.95 && t <= 6.15);
  } else if (t < 7.2) {
    // Move to Tab 2 at (720, 720)
    const p = smoothstep(6.6, 7.0, t);
    curX = 690 + p * (720 - 690);
    curY = 720;
    curPress = (t >= 6.95 && t <= 7.15);
  } else if (t < 7.8) {
    // Move to Tab 3 at (870, 720)
    const p = smoothstep(7.2, 7.5, t);
    curX = 720 + p * (870 - 720);
    curY = 720;
    curPress = (t >= 7.45 && t <= 7.65);
  } else if (t < 9.6) {
    // Move to Chart peak at (815, 680)
    const p = smoothstep(8.2, 8.8, t);
    curX = 870 + p * (815 - 870);
    curY = 720 + p * (680 - 720);
  } else if (t < 10.4) {
    // Move to Command Palette search input at (650, 680)
    const p = smoothstep(9.7, 10.2, t);
    curX = 815 + p * (650 - 815);
    curY = 680;
  } else if (t < 11.6) {
    // Move down to Command Palette item 1 at (720, 735)
    const p = smoothstep(11.0, 11.45, t);
    curX = 650 + p * (720 - 650);
    curY = 680 + p * (735 - 680);
  } else if (t < 12.2) {
    // Click Command Palette item at (720, 735)
    curX = 720;
    curY = 735;
    curPress = (t >= 11.48 && t <= 11.75);
  } else {
    // Return seamlessly to starting position (720, 720) with 0 velocity
    const p = smoothstep(12.6, 13.9, t);
    curX = 720 * (1 - p) + 720 * p;
    curY = 735 * (1 - p) + 720 * p;
    curPress = false;
  }

  // Update cursor element
  cursorEl.style.transform = `translate(${curX.toFixed(1)}px, ${curY.toFixed(1)}px) scale(${curPress ? 0.88 : 1.0})`;

  // Update Inspector display
  timeDisplay.textContent = `${t.toFixed(3)}s`;
  scrubber.value = Math.round(t * 1000);
  updateInspectorStateName(t);
};

// UI Inspector helper
const scrubber = document.getElementById('scrubber');
const timeDisplay = document.getElementById('time-display');
const stateNameDisplay = document.getElementById('state-name-display');
const btnPlay = document.getElementById('btn-play');
const btnAudio = document.getElementById('btn-audio');
const beatTrack = document.getElementById('beat-track');

// Create 28 beat track pills
for (let b = 1; b <= 28; b++) {
  const seg = document.createElement('div');
  seg.className = `beat-segment ${b % 4 === 1 ? 'downbeat' : ''}`;
  seg.title = `Beat ${b} (${((b - 1) * 0.5).toFixed(1)}s)`;
  seg.addEventListener('click', () => {
    seekTime = (b - 1) * 0.5;
    window.seek(seekTime);
  });
  beatTrack.appendChild(seg);
}

function updateInspectorStateName(t) {
  const beatNum = (t / 0.5) + 1;
  const beatIndex = Math.min(27, Math.floor(t / 0.5));
  const segs = beatTrack.children;
  for (let i = 0; i < segs.length; i++) {
    if (i === beatIndex) segs[i].classList.add('active');
    else segs[i].classList.remove('active');
  }

  let stateName = "Button";
  if (t < 0.5) stateName = "Button (Click)";
  else if (t < 1.0) stateName = "Morphing to Loader";
  else if (t < 1.5) stateName = "Checkmark Drawn";
  else if (t < 2.0) stateName = "Dynamic Island";
  else if (t < 2.5) stateName = "Dynamic Island → Music Player";
  else if (t < 3.0) stateName = "Music Player (Play → Pause)";
  else if (t < 3.5) stateName = "Scrubber Grab";
  else if (t < 4.0) stateName = "Scrubber Drag";
  else if (t < 4.5) stateName = "Morphing to Volume Slider";
  else if (t < 5.0) stateName = "Volume Overdrag (Elastic Stretch)";
  else if (t < 5.5) stateName = "Volume Snap Release";
  else if (t < 6.0) stateName = "Volume → Toggle Switch";
  else if (t < 6.5) stateName = "Toggle Flip (Asymmetric Springs)";
  else if (t < 7.0) stateName = "Toggle → Segmented Tabs";
  else if (t < 7.5) stateName = "Tab 1 → Tab 2 (Liquid Indicator)";
  else if (t < 8.0) stateName = "Tab 2 → Tab 3 (Liquid Indicator)";
  else if (t < 8.5) stateName = "Tabs → Chart Expand";
  else if (t < 9.0) stateName = "Chart Line Auto-Draw";
  else if (t < 9.5) stateName = "Data Point Hover & Tooltip";
  else if (t < 10.0) stateName = "Tooltip Dismiss";
  else if (t < 10.5) stateName = "Chart → ⌘K Command Palette";
  else if (t < 11.0) stateName = "Type to Filter ('deploy prod')";
  else if (t < 11.5) stateName = "Results Cascaded";
  else if (t < 12.0) stateName = "Item Enter / Select Hit";
  else if (t < 12.5) stateName = "Command Palette → Toast";
  else if (t < 13.0) stateName = "Toast Floating Dwell";
  else if (t < 13.5) stateName = "Toast → Initial Button Morph";
  else stateName = "Seamless Loop Settle";

  stateNameDisplay.textContent = `Beat ${beatNum.toFixed(1)}: ${stateName}`;
}

// Playback Engine
let isPlaying = true;
let playbackSpeed = 1.0;
let seekTime = 0.0;
let lastPerfTime = performance.now();

function animationLoop(now) {
  const dt = (now - lastPerfTime) / 1000;
  lastPerfTime = now;

  if (isPlaying) {
    seekTime = (seekTime + dt * playbackSpeed) % TOTAL_DURATION;
    window.seek(seekTime);
  }
  requestAnimationFrame(animationLoop);
}
requestAnimationFrame(animationLoop);

// Controls
btnPlay.addEventListener('click', () => {
  isPlaying = !isPlaying;
  btnPlay.textContent = isPlaying ? 'Pause' : 'Play';
  lastPerfTime = performance.now();
});

scrubber.addEventListener('input', (e) => {
  isPlaying = false;
  btnPlay.textContent = 'Play';
  seekTime = parseFloat(e.target.value) / 1000;
  window.seek(seekTime);
});

document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    playbackSpeed = parseFloat(btn.dataset.speed);
  });
});

// Initial seek
window.seek(0.0);

/**
 * High-Precision 120 BPM Web Audio Synthesizer:
 * Generates rhythmic downbeats and crisp tactile UI clicks on exact beat timestamps.
 */
let audioCtx = null;
let isMuted = true;
btnAudio.addEventListener('click', () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  isMuted = !isMuted;
  btnAudio.textContent = isMuted ? 'Unmute' : 'Mute';
  btnAudio.classList.toggle('active', !isMuted);
});

// Trigger UI click acoustic tick
function playTick(freq = 1800, dur = 0.02) {
  if (isMuted || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
</script>
